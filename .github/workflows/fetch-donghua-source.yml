name: Verify poster correction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install browser tools
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.65.1
          if ! command -v google-chrome >/dev/null; then npx playwright install --with-deps chromium; fi
      - name: Check real completed posters
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { existsSync } from 'node:fs';
          const fail = (error) => {
            console.log(`::error::${String(error?.stack || error).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 2000)}`);
            process.exit(1);
          };
          process.on('uncaughtException', fail);
          process.on('unhandledRejection', fail);
          const expected = [
            { title: 'Black Clover', year: '2017', id: '13209', original: 'fca4ddad225cd825c608245c1f34f57b.jpg' },
            { title: 'Naruto: Shippuuden', year: '2007', id: '1555', original: '32cbcdb1e524a1fb52273c0c95c98ffc.jpg' },
            { title: 'Boruto: Naruto Next Generations', year: '2017', id: '13051', original: 'bb01370dba6241974cd7595a99a8afde.jpg' },
          ];
          const exe = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable'].find(existsSync);
          const browser = await chromium.launch({ headless: true, ...(exe ? { executablePath: exe } : {}), args: ['--no-sandbox'] });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, colorScheme: 'dark' });
          const requests = [];
          const errors = [];
          page.on('request', (request) => {
            const url = new URL(request.url());
            if (url.pathname === '/api/artwork') requests.push({ title: url.searchParams.get('title'), year: url.searchParams.get('year') || '' });
          });
          page.on('pageerror', (error) => errors.push(error.message));
          await page.goto('https://nihnime.vercel.app/completed', { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.locator('.anime2-item-img').first().scrollIntoViewIfNeeded({ timeout: 45000 });
          await page.waitForFunction((targets) => targets.every((target) => {
            const img = [...document.querySelectorAll('.anime2-item-img')].find((el) => el.alt === target.title);
            if (!img?.complete || !img.naturalWidth || !img.currentSrc) return false;
            const url = new URL(img.currentSrc);
            return (url.hostname === 'media.kitsu.app' && url.pathname.includes(`/${target.id}/`)) || url.pathname.endsWith(target.original);
          }), expected, { timeout: 90000 });
          const observed = await page.locator('.anime2-item-img').evaluateAll((images, targets) => targets.map((target) => {
            const image = images.find((img) => img.alt === target.title);
            const url = new URL(image.currentSrc);
            return { title: target.title, host: url.hostname, path: url.pathname };
          }), expected);
          for (const item of observed) {
            const target = expected.find((entry) => entry.title === item.title);
            if (item.host === 'media.kitsu.app' && !requests.some((request) => request.title === item.title && request.year === target.year)) {
              throw new Error(`Incorrect lookup year for ${item.title}: ${JSON.stringify(requests)}`);
            }
          }
          if (errors.length) throw new Error(`Browser errors: ${errors.join('; ')}`);
          console.log(`::notice::Correct distinct posters loaded: ${JSON.stringify(observed)}`);
          console.log(`::notice::Poster lookup years: ${JSON.stringify(requests.filter((request) => expected.some((entry) => entry.title === request.title)))}`);
          await browser.close();
          JS
