name: Verify NIHNIME production playback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.65.1
          if ! command -v google-chrome >/dev/null; then npx playwright install --with-deps chromium; fi
      - name: Check real API, artwork and playback
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { existsSync } from 'node:fs';
          const reportError = (error) => {
            console.log(`::error::${String(error?.stack || error).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 2000)}`);
            process.exit(1);
          };
          process.on('uncaughtException', reportError);
          process.on('unhandledRejection', reportError);
          const base = 'https://nihnime.vercel.app';
          async function data(path) {
            const res = await fetch(base + path, { signal: AbortSignal.timeout(30000) });
            const body = await res.json();
            if (!res.ok || body.status !== 200) throw new Error(`${path}: ${body.message || res.status}`);
            return body.data;
          }
          const home = await data('/api/home');
          if (home.demo || !home.episode_baru?.length) throw new Error('No real recent episodes');
          console.log(`::notice::Real home loaded with ${home.episode_baru.length} recent titles`);
          const first = await data('/api/home-section?section=episode_baru&limit=31');
          const second = await data('/api/home-section?section=episode_baru&limit=61');
          if (first.length === 31 && second.length >= 61 && first[0]?.id === second[0]?.id && first[29]?.id === second[29]?.id && second[30]?.id !== second[0]?.id) {
            console.log(`::notice::Recent pagination verified: ${first.length} and ${second.length} entries`);
          } else console.log(`::warning::Recent pagination depends on provider limit: ${first.length} and ${second.length} entries`);
          let choice;
          for (const anime of home.episode_baru.slice(0, 8)) {
            const detail = await data(`/api/detail/${anime.id}`);
            const episode = detail.episodes?.[0];
            if (!episode) continue;
            const stream = await data(`/api/stream/${episode.id}`);
            const direct = stream.servers?.find((server) => server.type === 'direct' && /^https?:/.test(server.url));
            if (direct) { choice = { anime, episode, direct }; break; }
          }
          if (!choice) throw new Error('No direct video server among recent episodes');
          console.log(`::notice::Testing ${choice.anime.title}, ${choice.episode.title}`);
          const artworkParams = new URLSearchParams({ title: choice.anime.title });
          if (/^\d{4}$/.test(String(choice.anime.year))) artworkParams.set('year', choice.anime.year);
          const artwork = await data(`/api/artwork?${artworkParams}`);
          console.log(`::notice::Artwork fallback ${artwork?.poster ? 'matched' : 'not found'} for first title`);
          const exe = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable'].find(existsSync);
          const browser = await chromium.launch({ headless: true, ...(exe ? { executablePath: exe } : {}), args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'] });
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(error.message));
          await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.locator('.anime1-item-img').first().scrollIntoViewIfNeeded({ timeout: 45000 });
          await page.waitForFunction(() => [...document.querySelectorAll('.anime1-item-img')].slice(0, 4).some((image) => image.complete && image.naturalWidth && !image.currentSrc.includes('/images/nihnime.jpg')), null, { timeout: 90000 });
          const posters = await page.locator('.anime1-item-img').evaluateAll((images) => images.slice(0, 4).map((image) => ({ loaded: image.naturalWidth > 0, host: image.currentSrc ? new URL(image.currentSrc).hostname : null })));
          console.log('::notice::Recent poster checks: ' + JSON.stringify(posters));
          await page.goto(`${base}/episode/${choice.episode.id}?anime=${choice.anime.id}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
          const video = page.locator('video#video-player-video');
          await video.waitFor({ timeout: 45000 });
          try {
            await video.evaluate((element) => { element.muted = true; return element.play(); });
            await page.waitForFunction(() => document.querySelector('video')?.currentTime > 1, null, { timeout: 45000 });
            const details = await video.evaluate((element) => ({ currentTime: element.currentTime, readyState: element.readyState, width: element.videoWidth, height: element.videoHeight }));
            if (!details.width || !details.height) throw new Error('No decoded video frame');
            console.log('::notice::Playback advanced with decoded video: ' + JSON.stringify(details));
          } catch (error) {
            await page.getByRole('alert').filter({ hasText: 'Server video tidak dapat diputar' }).waitFor({ timeout: 15000 });
            console.log('::warning::Direct video did not play from this runner; the player displayed its failure message: ' + error.message.split('\n')[0]);
          }
          if (errors.length) throw new Error(`Browser errors: ${errors.join('; ')}`);
          await browser.close();
          JS
